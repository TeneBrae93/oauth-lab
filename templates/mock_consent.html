<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize Access | HackSmarter ID</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container" style="border-top: 4px solid #6366f1;">
        <div style="margin-bottom: 24px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        </div>
        
        <h3>Authorize Application</h3>
        <p style="color: #a5b4fc; font-size: 14px; margin-bottom: 20px;">Signed in as: <strong>{{ username }}</strong></p>
        <p><strong>Hack Smarter Learning Platform</strong> is requesting access to your centralized identity.</p>
        
        <div style="background: #0f1115; border: 1px solid #334155; border-radius: 6px; padding: 16px; text-align: left; margin-bottom: 24px;">
            <p style="margin: 0 0 10px 0; font-size: 13px; color: #94a3b8;">This will allow the application to:</p>
            <ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #cbd5e1;">
                <li style="margin-bottom: 6px;">Verify your identity</li>
                <li>Access your enrolled course data</li>
            </ul>
        </div>

        <form action="/oauth/approve" method="POST">
            <button type="submit" class="btn">Authorize</button>
        </form>
        <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
</body>
</html>
